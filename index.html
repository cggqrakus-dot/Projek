<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Project Figma - Kelompok 3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #1e1e2f;
            color: white;
            padding: 15px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        main {
            padding: 20px;
        }

        .figma-container {
            width: 100%;
            height: 650px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background-color: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

<header>
    <h1>Project Desain Figma</h1>
    <p>Menampilkan desain Figma ke dalam Website</p>
</header>

<main>
    <h2>Tiket Pesawat</h2>

    <div class="figma-container">
        <iframe 
            src="https://www.figma.com/embed?embed_host=share&url=https://www.figma.com/design/YgdyHTvqV5vO9XYTx9uStu/Untitled?node-id=0-1">
        </iframe>
    </div>

    <a class="btn" 
       href="https://www.figma.com/design/YgdyHTvqV5vO9XYTx9uStu/Untitled?node-id=0-1" 
       target="_blank">
       Buka di Figma
    </a>
</main>

<footer>
    © 2025 - Project Figma | Dibuat oleh Kelompok 3
</footer>

</body>
</html>
